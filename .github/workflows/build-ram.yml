
name: Build FX-ID5L RAM-only OpenWrt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout build kit
        uses: actions/checkout@v4

      - name: Free storage space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/powershell
          sudo apt-get clean
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential clang flex bison g++ gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip \
            zlib1g-dev file curl wget ca-certificates subversion patch pkgconf \
            libelf-dev xz-utils zstd

      - name: Compile OpenWrt
        env:
          JOBS: '2'
          WORKDIR: ${{ github.workspace }}/openwrt-src
        run: bash build_ram.sh

      - name: Collect RAM-boot firmware
        run: |
          mkdir -p output
          find openwrt-src/bin/targets/ramips/mt76x8/ -maxdepth 1 \
            -type f -name '*zbt-we1226*initramfs-kernel.bin' \
            -exec cp -v {} output/ \;
          test -n "$(find output -maxdepth 1 -type f -name '*.bin' -print -quit)"
          (cd output && sha256sum ./*.bin > SHA256SUMS)

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: FX-ID5L-OpenWrt-25.12.5-RAM-ONLY
          path: output/
          retention-days: 14
          if-no-files-found: error
